<div id="tf-v2" aria-label="潮汐舰队 V2 页面结构预览">
  <div class="reviewbar">
    <label>画布 <select id="tf-device"><option value="360">360 × 640</option><option value="390" selected>390 × 844</option><option value="430">430 × 932</option></select></label>

  </div>
  <div class="reviewbar" id="tf-pages"><button data-page="home">主界面</button><button data-page="game">局内</button><button data-page="result">结算</button><button data-page="collection">图鉴</button><button data-page="draw">抽奖</button><button data-page="shop">补给</button></div>

</div>
<style>
#tf-v2 {color-scheme:light dark;font:15px/1.45 system-ui,sans-serif;color:light-dark(#173641,#ecf3f5);--tf-paper:light-dark(#f4f6f4,#102c38);--tf-card:light-dark(#fff,#193e4a);--tf-ink:light-dark(#173641,#ecf3f5);--tf-line:light-dark(#bdcbd0,#47717c);--tf-secondary:light-dark(#e4ecee,#214650);--tf-action:light-dark(#254b59,#c1dce4);--tf-action-ink:light-dark(#fff,#102c38);--tf-water:light-dark(#d2e3e7,#12333e);--tf-lane:light-dark(#afc9d0,#28525f);--tf-ship:light-dark(#f7faf9,#b9d6dd);--tf-ship-ink:#244954}
#tf-v2 *{box-sizing:border-box} #tf-v2 button,#tf-v2 select{font:inherit;color:inherit} #tf-v2 button{border:1px solid var(--tf-line);background:var(--tf-card);border-radius:10px;padding:10px 12px;min-height:48px} #tf-v2 button:focus-visible,#tf-v2 select:focus-visible{outline:3px solid var(--tf-action);outline-offset:2px} #tf-v2 button:disabled{opacity:.6} #tf-v2 button.primary{background:var(--tf-action);color:var(--tf-action-ink);border-color:transparent} #tf-v2 .reviewbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px} #tf-v2 .reviewbar button{min-height:36px;padding:6px 14px} #tf-v2 .reviewbar label{display:flex;align-items:center;gap:6px} #tf-v2 select{max-width:100%;background:var(--tf-card);border:1px solid var(--tf-line);padding:6px;border-radius:6px} #tf-v2 .caption{font-size:12px;margin:8px 0 12px} #tf-v2 .frame{margin:auto;position:relative;overflow:hidden} #tf-v2 .phone{position:absolute;top:0;left:0;transform-origin:top left;background:var(--tf-paper);color:var(--tf-ink);border:1px solid var(--tf-line);overflow:hidden;border-radius:20px} #tf-v2 .inset{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--tf-secondary)} #tf-v2 .top{top:0} #tf-v2 .bottom{bottom:0} #tf-screen{position:absolute;left:0;right:0;overflow:hidden} #tf-v2 .page{height:100%;display:flex;flex-direction:column} #tf-v2 .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px;padding:4px 12px} #tf-v2 h2{font-size:23px;line-height:1.2;margin:12px 0} #tf-v2 h3{font-size:18px;margin:6px 0 12px} #tf-v2 p{margin:8px 0} #tf-v2 .small{font-size:13px} #tf-v2 .scroll{overflow-y:auto;min-height:0;flex:1;padding:12px 16px;overscroll-behavior:contain} #tf-v2 .foot{padding:10px 16px;display:grid;gap:8px;background:var(--tf-paper);border-top:1px solid var(--tf-line)} #tf-v2 .row{display:flex;gap:8px;align-items:center} #tf-v2 .row>*{flex:1;min-width:0} #tf-v2 .box{background:var(--tf-card);border:1px solid var(--tf-line);border-radius:12px;padding:14px;margin:10px 0} #tf-v2 .hero{height:110px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--tf-secondary);border-radius:14px;gap:8px;margin-bottom:12px} #tf-v2 .ship-sample{width:40px;height:72px;background:var(--tf-ship);color:var(--tf-ship-ink);clip-path:polygon(50% 0,100% 22%,100% 94%,0 94%,0 22%);display:flex;align-items:center;justify-content:center;border-bottom:8px solid var(--tf-lane)} #tf-v2 .total{font-size:32px;font-weight:600;text-align:center} #tf-v2 dl{display:grid;grid-template-columns:1fr auto;gap:9px;margin:10px 0} #tf-v2 dd{margin:0} #tf-v2 .track{height:8px;border-radius:4px;background:var(--tf-secondary);overflow:hidden;margin:12px 0} #tf-v2 .track>span{display:block;height:100%;background:var(--tf-action)} #tf-v2 .slots{display:grid;grid-template-columns:repeat(5,1fr);gap:5px} #tf-v2 .slots button{font-size:12px;padding:5px 1px;min-height:54px} #tf-v2 .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0} #tf-v2 .cards button{height:106px;padding:6px;font-size:13px;display:flex;flex-direction:column;justify-content:center;gap:6px;align-items:center} #tf-v2 .cards .shape{height:26px;width:14px;background:var(--tf-lane);clip-path:polygon(50% 0,100% 25%,100% 100%,0 100%,0 25%)} #tf-v2 .cards .locked .shape{opacity:.45} #tf-v2 .notice{font-size:13px;padding:9px 0} #tf-v2 #tf-modal{position:absolute;inset:0;background:#001922aa;z-index:10;align-items:center;justify-content:center;padding:16px} #tf-v2 #tf-modal:not([hidden]){display:flex} #tf-v2 .dialog{background:var(--tf-paper);border-radius:16px;border:1px solid var(--tf-line);padding:20px;width:100%;max-height:100%;overflow-y:auto} #tf-v2 .dialog button{width:100%;margin-top:10px} #tf-v2 .game{height:100%;position:relative} #tf-v2 .battle{position:absolute;left:12px;right:12px;top:58px;bottom:8px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;font-size:12px} #tf-v2 .boss{padding:2px 28px;background:var(--tf-secondary);border-radius:30px} #tf-v2 .hp{width:65%;height:5px;background:var(--tf-action);border-radius:4px} #tf-v2 .fleet{display:flex;width:100%;justify-content:space-around;align-items:center} #tf-v2 .lane{position:absolute;background:var(--tf-lane);border-radius:9px} #tf-v2 .board{position:absolute;background:var(--tf-water)} #tf-v2 .piece{position:absolute;display:flex;align-items:center;justify-content:center;background:var(--tf-ship);color:var(--tf-ship-ink);font-size:12px;border:1px solid var(--tf-line);border-radius:4px} #tf-v2 .tools{position:absolute;bottom:0;left:12px;right:12px;display:flex;flex-direction:column;justify-content:center;gap:6px} #tf-v2 .tools button{font-size:14px;padding:5px} #tf-v2 .tools p{margin:0;text-align:center;font-size:12px} #tf-v2 .gamehud{display:flex;align-items:center;justify-content:space-between;padding:4px 12px;gap:8px;font-size:13px} #tf-v2 .gamehud button{min-width:48px;padding:5px} #tf-v2 .listrow{padding:10px 0;border-bottom:1px solid var(--tf-line);display:flex;justify-content:space-between;gap:8px} #tf-v2 [aria-pressed=true]{background:var(--tf-action);color:var(--tf-action-ink)}
</style>
<script>
(()=>{
const root=document.getElementById('tf-v2'), screen=root.querySelector('#tf-screen'), modal=root.querySelector('#tf-modal'), phone=root.querySelector('#tf-phone');
const names=['海风号','木壳号','珊瑚号','巡逻号','渔业号','海军号','救援号','极地号','科研号','幽灵号','深海荧光号','皇家号','黄金舰队号','海盗王号','未来科技号','潮汐神舟号'];
const rarity=i=>i<5?'白':i<9?'蓝':i<12?'紫':i<14?'金':'红';
const ships=[{"x":3,"y":6,"d":"Right"},{"x":5,"y":5,"d":"Up"},{"x":4,"y":8,"d":"Right"},{"x":6,"y":16,"d":"Down"},{"x":3,"y":13,"d":"Right"},{"x":3,"y":12,"d":"Right"},{"x":6,"y":12,"d":"Down"},{"x":6,"y":7,"d":"Down"},{"x":6,"y":5,"d":"Down"},{"x":3,"y":7,"d":"Left"},{"x":7,"y":16,"d":"Down"},{"x":10,"y":12,"d":"Down"},{"x":6,"y":10,"d":"Left"},{"x":9,"y":12,"d":"Up"},{"x":9,"y":14,"d":"Left"},{"x":11,"y":3,"d":"Up"},{"x":10,"y":11,"d":"Left"},{"x":6,"y":11,"d":"Left"},{"x":1,"y":16,"d":"Down"},{"x":1,"y":13,"d":"Down"},{"x":1,"y":10,"d":"Down"},{"x":2,"y":8,"d":"Left"},{"x":1,"y":7,"d":"Down"},{"x":2,"y":5,"d":"Down"},{"x":1,"y":4,"d":"Left"},{"x":0,"y":4,"d":"Down"},{"x":0,"y":0,"d":"Left"},{"x":8,"y":1,"d":"Up"},{"x":7,"y":6,"d":"Down"},{"x":7,"y":4,"d":"Down"},{"x":7,"y":3,"d":"Left"},{"x":5,"y":3,"d":"Down"},{"x":4,"y":0,"d":"Right"},{"x":6,"y":0,"d":"Right"},{"x":8,"y":4,"d":"Up"},{"x":7,"y":8,"d":"Right"},{"x":9,"y":8,"d":"Down"},{"x":9,"y":1,"d":"Down"},{"x":8,"y":0,"d":"Right"},{"x":5,"y":10,"d":"Up"},{"x":5,"y":12,"d":"Up"},{"x":6,"y":15,"d":"Right"},{"x":8,"y":13,"d":"Up"},{"x":8,"y":15,"d":"Right"},{"x":8,"y":6,"d":"Right"},{"x":8,"y":7,"d":"Right"},{"x":10,"y":6,"d":"Down"},{"x":9,"y":5,"d":"Right"},{"x":5,"y":2,"d":"Left"},{"x":10,"y":8,"d":"Right"},{"x":12,"y":8,"d":"Up"},{"x":10,"y":10,"d":"Right"},{"x":2,"y":10,"d":"Up"},{"x":12,"y":11,"d":"Up"},{"x":12,"y":14,"d":"Right"},{"x":9,"y":16,"d":"Up"},{"x":11,"y":13,"d":"Up"},{"x":10,"y":15,"d":"Right"},{"x":13,"y":15,"d":"Up"},{"x":10,"y":3,"d":"Down"},{"x":2,"y":12,"d":"Up"},{"x":7,"y":9,"d":"Left"},{"x":3,"y":9,"d":"Left"},{"x":1,"y":9,"d":"Left"},{"x":0,"y":7,"d":"Up"},{"x":0,"y":9,"d":"Up"},{"x":10,"y":0,"d":"Right"},{"x":12,"y":15,"d":"Up"},{"x":11,"y":17,"d":"Right"},{"x":12,"y":2,"d":"Down"},{"x":5,"y":15,"d":"Up"},{"x":3,"y":4,"d":"Down"},{"x":3,"y":2,"d":"Left"},{"x":13,"y":12,"d":"Down"},{"x":12,"y":1,"d":"Right"},{"x":12,"y":10,"d":"Right"},{"x":4,"y":16,"d":"Up"},{"x":11,"y":7,"d":"Right"},{"x":2,"y":15,"d":"Left"},{"x":0,"y":15,"d":"Left"}];
const sizes={360:[360,640,24,24],390:[390,844,44,34],430:[430,932,44,34]};
const settings={device:'390',safe:true};
let state, lastFocus, origin='home';
function reset(fixture='normal') {state={fixture,page:'home',level:3,coins:307,tickets:0,owned:[0,5],slots:[0,null,null,null,null],selected:5,inventory:[1,1,1],remaining:5,filter:'全部',source:'全部',notice:'',pendingGift:false,completed:false};origin='home';
if(fixture==='gift'){state.page='result';state.level=2;state.owned=[0];state.pendingGift=true;state.completed=true;}
if(fixture==='ten'){state.page='draw';state.level=4;state.coins=3000;}
if(fixture==='full'){state.page='detail';state.level=5;state.owned=[0,1,2,3,4,5];state.slots=[0,1,2,3,4];}
if(fixture==='last'){state.page='result';state.level=10;state.coins=4000;state.completed=true;}
if(fixture==='error')state.page='result';
modal.hidden=true;render();if(fixture==='ten')draw('ten');if(fixture==='deadlock'){state.page='game';render();deadlock();}}
function btn(text,action,primary=false,disabled=false){return `<button type="button" data-act="${action}" class="${primary?'primary':''}" ${disabled?'disabled':''}>${text}</button>`;}
function page(title,content,footer,back='back'){return `<section class="page"><header class="bar">${btn('返回',back)}<h3>${title}</h3><span class="small">金币 ${state.coins}</span></header><div class="scroll">${content}</div><footer class="foot">${footer}</footer></section>`;}
function dialog(title,body,buttons){lastFocus=document.activeElement;screen.inert=true;modal.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2>${body}${buttons}</section>`;modal.hidden=false;modal.querySelector('button')?.focus();}
function close(){modal.hidden=true;screen.inert=false;if(lastFocus?.isConnected)lastFocus.focus();}
function navigate(p){state.page=p;state.notice='';close();render();screen.querySelector('button')?.focus();}
function geometry(){let [w,h,t,b]=sizes[settings.device];if(!settings.safe)t=b=0;const H=h-t-b,T=Math.min(196,Math.max(128,H*.22)),B=Math.min(120,Math.max(88,H*.14)),M=H-T-B-16,c=Math.min((w-32)/17,(M-32)/21);return{w,h,t,b,H,T,B,M,c};}
function render(){const g=geometry();phone.style.width=g.w+'px';phone.style.height=g.h+'px';screen.style.top=g.t+'px';screen.style.height=g.H+'px';modal.style.top=g.t+'px';modal.style.bottom=g.b+'px';root.querySelector('.inset.top').style.height=g.t+'px';root.querySelector('.inset.bottom').style.height=g.b+'px';root.querySelector('.inset.top').textContent=g.t?'系统安全区':'';root.querySelector('.inset.bottom').textContent=g.b?'系统手势区':'';
const slots=()=>`<div class="slots">${state.slots.map((id,i)=>btn(`${i+1}<br>${id===null?'空槽':names[id]}`,`slot:${i}`)).join('')}</div><p class="small">装备在下一次挑战生效，不改变当前船阵。</p>`;
if(state.page==='home'){
 const done=state.completed&&state.level===10,next=state.completed?state.level+1:state.level,blocked=state.fixture==='error';
 screen.innerHTML=`<section class="page"><header class="bar">${btn('设置','settings')}<span>金币 ${state.coins}</span><span>收藏券 ${state.tickets}</span></header><div class="scroll" style="display:flex;flex-direction:column;justify-content:center;text-align:center"><p class="small">TIDEBOUND FLEET</p><h2>潮汐舰队</h2><div class="hero" style="min-height:160px;height:28%;margin-top:20px"><div class="ship-sample" style="transform:scale(1.35)">↑</div><span style="margin-top:12px">旗舰展示位</span></div><h3>第一海域</h3><p>${done?'10 / 10 · 当前内容已完成':`航向第 ${next} 关`}</p><p class="small">${blocked?'上次通关尚未保存，请先重试':state.completed?'奖励已保存':`当前挑战可恢复 · 道具剩余 ${state.remaining}/5 次`}</p>${state.pendingGift?btn('领取首艘蓝皮','gift',true):''}</div><footer class="foot">${btn(blocked?'重试保存':done?'查看航程':state.completed?'开始下一关':'继续挑战',blocked?'retry':done?'overview':state.pendingGift?'gift':'play',true)}<div class="row">${btn('抽奖','draw',false,blocked)}${btn('图鉴 · 装备','collection',false,blocked||state.pendingGift)}${btn('道具补给','shop',false,blocked)}</div></footer></section>`;
}else if(state.page==='game'){
 const laneTop=g.T+8+(g.M-21*g.c)/2,laneLeft=(g.w-17*g.c)/2;
 screen.innerHTML=`<section class="game"><div style="height:${g.T}px;position:relative"><header class="gamehud">${btn('菜单','menu')}<span>第 ${state.level} 关<br>金币 ${state.coins}</span><span class="small">本局待结算 0</span>${btn('暂停','pause')}</header><div class="battle"><div class="boss">海怪　800 / 800</div><div class="hp"></div><div class="fleet"><span>海风号 ×0</span><span>·</span><span>·</span><span>·</span><span>·</span></div></div></div><div class="lane" style="left:${laneLeft}px;top:${laneTop}px;width:${17*g.c}px;height:${21*g.c}px"></div><div class="board" role="img" aria-label="真实第3关80船静态布局；不能在此操作船" style="left:${laneLeft+1.5*g.c}px;top:${laneTop+1.5*g.c}px;width:${14*g.c}px;height:${18*g.c}px">${ships.map(s=>{const horizontal=s.d==='Left'||s.d==='Right',w=horizontal?2:1,h=horizontal?1:2;return `<span class="piece" style="left:${s.x*g.c+2}px;top:${(18-s.y-h)*g.c+2}px;width:${w*g.c-4}px;height:${h*g.c-4}px">${({Left:'←',Right:'→',Up:'↑',Down:'↓'})[s.d]}</span>`;}).join('')}</div><div class="tools" style="height:${g.B}px"><p>本次挑战剩余 ${state.remaining} / 5 次道具</p><div class="row">${['救援','洗牌','反转'].map((n,i)=>btn(`${n}　${state.inventory[i]}`,`tool:${i}`)).join('')}</div></div></section>`;
}else if(state.page==='result'){
 const l=state.level,failed=state.fixture==='error',gift=state.fixture==='gift',reward=100+20*(l-1)+80;
 screen.innerHTML=page(failed?'保存未完成':'顺利通关',`${failed?'<div class="box"><h3>通关结果尚未保存</h3><p>请重试保存。奖励到账后才能继续。</p></div>':`<div class="hero"><div class="ship-sample">↑</div><span>舰队凯旋</span></div><div class="total">+ ${reward} 金币</div><dl><dt>首次通关</dt><dd>${reward-80}</dd><dt>战斗金币</dt><dd>80</dd></dl><p class="small">已入账 · 展示动画不会重复发放</p><div class="box"><h3>第一海域　${l} / 10</h3><div class="track"><span style="width:${l*10}%"></span></div><p>${l===10?'当前10关已完成，后续内容准备中。':`再过 ${10-l} 关，完成本海域。`}</p></div>`}`,failed?btn('重试保存','retry',true):`${btn(l===10?'返回主界面':gift?'返回主界面领取蓝皮':'下一关',l===10||gift?'home':'next',true)}${btn('返回主界面','home')}`,'home');
}else if(state.page==='collection'){
 const visible=names.map((n,i)=>i).filter(i=>(state.filter==='全部'||rarity(i)===state.filter)&&(state.source==='全部'||(state.source==='已拥有'?state.owned.includes(i):!state.owned.includes(i))));
 screen.innerHTML=page('舰队图鉴',`<p>已拥有 ${state.owned.length} / 16 <span class="small">（含默认船）</span></p>${slots()}<div class="row"><label>品质 <select data-filter="rarity">${['全部','白','蓝','紫','金','红'].map(n=>`<option ${n===state.filter?'selected':''}>${n}</option>`).join('')}</select></label><label>拥有 <select data-filter="source">${['全部','已拥有','未拥有'].map(n=>`<option ${n===state.source?'selected':''}>${n}</option>`).join('')}</select></label></div><div class="cards">${visible.map(i=>`<button data-act="skin:${i}" class="${state.owned.includes(i)?'':'locked'}"><span class="shape"></span><span>${names[i]}</span><span class="small">${rarity(i)} · ${state.slots.includes(i)?'已装备':state.owned.includes(i)?'已拥有':'未拥有'}</span></button>`).join('')}</div>`,`${state.notice?`<p role="status">${state.notice}</p>`:''}${btn('返回主界面','home',true)}`);
}else if(state.page==='draw'){
 screen.innerHTML=page('船只抽奖',`<div class="hero"><div class="ship-sample">↑</div><span>收集新的舰队外观</span></div><h3>单抽 ${singlePrice()} 金币</h3><p>本次十连总价 ${singlePrice()*9} 金币</p><div class="box"><p>十连至少紫品质</p><p>20抽保底金或以上 · 60抽保底红</p><p class="small">免费蓝皮与券兑换不推进普通保底。重复皮肤转为收藏券。</p></div><p>新皮肤需要自行装备，下一次挑战生效。</p>`,`${state.pendingGift?btn('先领取免费蓝皮','gift',true):`<div class="row">${btn('单抽 '+singlePrice(),'single',true)}${btn((state.level+(state.completed?1:0))<4?'十连 第4关开放':'十连 '+singlePrice()*9,'ten',false,(state.level+(state.completed?1:0))<4)}</div>`}${btn('概率与保护说明','rates')}`,'home');
}else if(state.page==='detail'){
 const i=state.selected,owned=state.owned.includes(i),equipped=state.slots.includes(i),cap=[1,2,3,5,8][i<5?0:i<9?1:i<12?2:i<14?3:4];
 screen.innerHTML=page(names[i],`<div class="hero"><div class="ship-sample">↑</div><span>${rarity(i)}品质 · ${owned?'已拥有':'未拥有'}</span></div><div class="row">${btn('转向预览','rotate')}${btn('炮击演示','fire')}</div><div class="box"><p>标准船 · 1×2</p><p>每船命中金币 ${cap===1?'1':`1～${cap}`}</p><p class="small">收益概率受同款船占比影响。移动、阻挡和每船10伤害不变。</p></div>${slots()}<p role="status">${state.notice}</p>`,owned?btn(equipped?'卸下该皮肤':'装备到舰队',equipped?'unequip':'equip',true):`${btn((state.level+(state.completed?1:0))<5?'兑换 第5关开放':'收藏券不足','exchange',false,true)}<p class="small">需要 ${[60,150,400,1000,2500][i<5?0:i<9?1:i<12?2:i<14?3:4]} 券 · 当前 0</p>`,'collection');
}else if(state.page==='shop')screen.innerHTML=page('道具补给',`<p>当前挑战剩余 ${state.remaining}/5 次使用机会</p><p class="small">购买只增加库存，不会增加本局次数。</p>${['救援 · 随机外围2船','洗牌 · 局部最多5船','反转 · 手选原地180°','组合包 · 三类各1'].map((n,i)=>`<div class="box"><h3>${n}</h3><p class="small">${i===3?'购买后入库，不自动使用':`现有库存 ${state.inventory[i]}`}</p>${btn([250,300,200,650][i]+' 金币',`buy:${i}`,true)}</div>`).join('')}<p role="status">${state.notice}</p>`,btn('返回主界面','home'));
else if(state.page==='overview')screen.innerHTML=page('航程概览',`<div class="hero">第一海域</div><h2>${state.level} / 10 关</h2><p>${state.level===10?'当前内容已完成':'沿航线继续前进'}</p><div class="track"><span style="width:${state.level*10}%"></span></div><p class="small">仅显示已发布内容；本节点没有额外领取奖励。</p>`,`${state.level<10?btn('继续','next',true):btn('查看收藏','collection',true)}${btn('返回结算','result')}`,'result');
screen.inert=!modal.hidden;root.querySelectorAll('#tf-pages button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===state.page));fit();}
function fit(){const g=geometry(),f=root.querySelector('.frame'),scale=Math.min(1,root.clientWidth/g.w);f.style.width=g.w*scale+'px';f.style.height=g.h*scale+'px';phone.style.transform=`scale(${scale})`;}
function singlePrice(){const u=state.owned.length-1;return u<4?300:u<8?450:u<12?700:1000;}
function draw(kind){const cost=singlePrice()*(kind==='ten'?9:1);dialog(kind==='ten'?'确认十连':'确认单抽',`<dl><dt>总价</dt><dd>${cost} 金币</dd><dt>当前余额</dt><dd>${state.coins}</dd><dt>${state.coins>=cost?'扣后余额':'还差'}</dt><dd>${Math.abs(state.coins-cost)}</dd></dl><p class="small">${kind==='ten'?'整批按当前单价×9锁价，至少一款紫或更高品质。':'结果保存成功后展示。'} 新皮肤不会自动装备。</p>`,btn(state.coins>=cost?'确认抽取':'金币不足',`draw:${kind}`,true,state.coins<cost)+btn('取消','close'));}
function deadlock(){dialog('暂时没有船能移动','<p>可尝试道具调整，或免费重开本关。</p><p class="small">同一盘面关闭后不反复弹出。</p>',btn('查看可用道具','deadtools',true)+btn('免费重开','restart')+btn('暂不处理','close'));}
root.addEventListener('change',e=>{if(e.target.id==='tf-device'){settings.device=e.target.value;render();}else if(e.target.id==='tf-safe'){settings.safe=e.target.checked;render();}else if(e.target.id==='tf-fixture')reset(e.target.value);else if(e.target.dataset.filter){state[e.target.dataset.filter==='rarity'?'filter':'source']=e.target.value;render();}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){if(b.dataset.page==='result'&&!state.completed&&state.fixture!=='error'){state.coins+=100+20*(state.level-1)+80;state.completed=true;}navigate(b.dataset.page);return;}const a=b.dataset.act;if(!a)return;
if(['home','game','draw','collection','shop','result','overview'].includes(a)){navigate(a);return;}if(a==='back'){navigate(origin);return;}if(a==='close'){close();return;}
if(a==='menu'||a==='pause'){dialog(a==='pause'?'已暂停':'挑战菜单','<p>第 '+state.level+' 关</p>',btn('继续挑战','close',true)+btn('重开本关','restart')+btn('设置','settings')+btn('返回主界面','home'));return;}
if(a==='settings'){dialog('设置','<p>减少动态效果、自动直出提示、静态高亮与音效将在Unity中接入原设置。</p>',btn('返回挑战','close',true));return;}
if(a==='single'||a==='ten'){draw(a);return;}if(a==='rates'){dialog('概率与保护','<p>基础权重：白48%、蓝30%、紫15%、金6%、红1%。</p><p>十连至少紫；20抽金或以上；60抽红。保底时在满足品质的剩余权重中归一化。</p><p>连续重复保护按现有规则处理；重复转券，不增加伤害。免费蓝皮与兑换不推进保底。</p>',btn('知道了','close',true));return;}
if(a.startsWith('skin:')){state.selected=+a.split(':')[1];navigate('detail');return;}
if(a==='equip'){const slot=state.slots.indexOf(null);if(slot>=0){state.slots[slot]=state.selected;state.notice='已装备到槽位 '+(slot+1)+'，下一次挑战生效。';render();}else dialog('选择替换的槽位','<p>将 '+names[state.selected]+' 放入哪一个槽？</p>',state.slots.map((s,i)=>btn((i+1)+' · '+names[s],`replace:${i}`)).join('')+btn('取消','close'));return;}
if(a.startsWith('replace:')){state.slots[+a.split(':')[1]]=state.selected;close();state.notice='已替换，下一次挑战生效。';render();return;}
if(a==='unequip'){state.slots=state.slots.map(s=>s===state.selected?null:s);state.notice='已卸下；空池开局使用默认船。';render();return;}
if(a.startsWith('slot:')){const i=+a.split(':')[1];if(state.slots[i]===null){state.notice='从图鉴选择已拥有船只后装备。';render();}else{state.selected=state.slots[i];navigate('detail');}return;}
if(a==='rotate'){const el=screen.querySelector('.ship-sample'),turn=(+(el.dataset.turn||0)+90)%360;el.dataset.turn=turn;el.style.transform=`rotate(${turn}deg)`;return;}
if(a==='fire'){state.notice='炮击预览仅展示动作，不产生战斗收益。';render();return;}
if(a.startsWith('buy:')){const i=+a.split(':')[1],cost=[250,300,200,650][i];dialog('确认购买',`<p>${['救援×1','洗牌×1','反转×1','三类各1'][i]} · ${cost} 金币</p><p>余额 ${state.coins} · ${state.coins>=cost?'扣后 '+(state.coins-cost):'还差 '+(cost-state.coins)}</p><p class="small">入库后自行使用；本局次数不增加。</p>`,btn(state.coins>=cost?'确认购买':'金币不足',`purchase:${i}`,true,state.coins<cost)+btn('取消','close'));return;}
if(a.startsWith('purchase:')){const i=+a.split(':')[1];state.coins-=[250,300,200,650][i];state.inventory=state.inventory.map((v,k)=>v+(i===3||i===k?1:0));close();state.notice='购买已入库，本局额度不变（演示）。';render();return;}
if(a.startsWith('draw:')){const kind=a.split(':')[1];state.coins-=singlePrice()*(kind==='ten'?9:1);const results=kind==='ten'?[1,2,5,1,6,3,9,2,4,7]:[1];const lines=results.map((i,n)=>{const dup=state.owned.includes(i),tickets=i<5?10:i<9?20:50;if(!dup)state.owned.push(i);else state.tickets+=tickets;return `<div class="listrow"><span>${n+1}. ${names[i]} · ${rarity(i)}</span><span>${dup?'重复 +'+tickets+'券':'新获得'}</span></div>`;}).join('');render();dialog('获得船只',`<p class="small">固定结果样例 · 已保存状态的展示</p>${lines}<p>新皮肤尚未装备。</p>`,btn('收下并查看图鉴','collection',true));return;}
if(a==='gift'){dialog('领取首艘蓝皮','<p>第2关已通关，赠送一款未拥有蓝皮。</p><p class="small">免费，不计普通保底；领取后由你选择装备。</p>',btn('免费领取','claim',true)+btn('返回结算','close'));return;}
if(a==='claim'){state.owned=[0,5];state.selected=5;state.fixture='normal';state.pendingGift=false;dialog('获得海军号','<p>蓝品质 · 新获得</p><p>下一次挑战开始前装备才会进入新船阵。</p>',btn('查看并装备','giftDetail',true)+btn('稍后装备，返回主界面','home'));return;}
if(a==='giftDetail'){navigate('detail');return;}
if(a==='next'||a==='play'){if(state.fixture==='error'){navigate('result');return;}if(state.pendingGift){navigate('home');return;}if(state.completed){if(state.level===10){navigate('home');return;}state.level++;state.completed=false;state.remaining=5;}navigate('game');return;}
if(a==='retry'){state.fixture='normal';state.coins=527;state.completed=true;navigate('result');return;}
if(a==='restart'){dialog('重开本关？','<p>将创建新的挑战；已使用的库存不退还，本局使用额度恢复为5次。重开本身不收费。</p>',btn('确认重开','restartYes',true)+btn('取消','close'));return;}
if(a==='restartYes'){state.remaining=5;state.completed=false;navigate('game');return;}
if(a==='deadtools'){close();navigate('game');return;}
if(a.startsWith('tool:')){dialog('道具操作位置','<p>实际使用由Unity处理。库存不足时可返回主界面补给，再继续原挑战；本局额度不刷新。</p>',btn('返回主界面','home')+btn('关闭','close'));}
});
root.addEventListener('keydown',e=>{if(modal.hidden)return;if(e.key==='Escape'){close();e.preventDefault();}if(e.key==='Tab'){const all=[...modal.querySelectorAll('button:not(:disabled)')];if(e.shiftKey&&document.activeElement===all[0]){all[all.length-1].focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===all[all.length-1]){all[0].focus();e.preventDefault();}}});
function restorePreview(snapshot){const saved=snapshot?.privateContent;if(!saved)return;if(sizes[saved.device])settings.device=saved.device;if(typeof saved.safe==='boolean')settings.safe=saved.safe;root.querySelector('#tf-device').value=settings.device;root.querySelector('#tf-safe').checked=settings.safe;const allowed=['normal','gift','ten','full','deadlock','error','last'];if(allowed.includes(saved.fixture)){root.querySelector('#tf-fixture').value=saved.fixture;reset(saved.fixture);}else render();}
function rememberPreview(){window.openai?.setWidgetState?.({modelContent:{preview:'V2主页承载收藏和抽奖',fixture:state.fixture},privateContent:{device:settings.device,safe:settings.safe,fixture:root.querySelector('#tf-fixture').value}})?.catch(()=>{});}
root.addEventListener('change',rememberPreview);
window.addEventListener('openai:set_globals',e=>restorePreview(e.detail?.globals?.widgetState));
new ResizeObserver(fit).observe(root);reset();restorePreview(window.openai?.widgetState);
if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:()=>{root.querySelector('#tf-device').value=settings.device;root.querySelector('#tf-safe').checked=settings.safe;render();}});tweak.addSelect(settings,'device',{label:'画布',options:['360','390','430']});tweak.addToggle(settings,'safe',{label:'系统安全区'});}
})();
</script>
