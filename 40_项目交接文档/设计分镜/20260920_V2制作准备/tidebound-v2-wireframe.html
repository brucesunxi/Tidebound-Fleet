{"x":2,"y":15,"d":"Left"},{"x":0,"y":15,"d":"Left"}];

let state, lastFocus, origin='home';
function reset(fixture='normal') {state={fixture,page:'home',level:3,coins:307,tickets:0,owned:[0,5],slots:[0,null,null,null,null],selected:5,inventory:[1,1,1],remaining:5,filter:'全部',source:'全部',notice:'',pendingGift:false,completed:false,category:'skin',cosmetics:{trail:0,display:0,background:0}};origin='home';
if(fixture==='cosmetics'){state.page='collection';state.category='trail';}

function btn(text,action,primary=false,disabled=false){return `<button type="button" data-act="${action}" class="${primary?'primary':''}" ${disabled?'disabled':''}>${text}</button>`;}
function icon(name){return `<i data-lucide="${name}" aria-hidden="true"></i>`;}

function homeMarkup(){
 const done=state.completed&&state.level===10,next=state.completed?state.level+1:state.level,blocked=state.fixture==='error',cleared=state.completed?state.level:state.level-1;

}

function dialog(title,body,buttons){lastFocus=document.activeElement;screen.inert=true;modal.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2>${body}${buttons}</section>`;modal.hidden=false;modal.querySelector('button')?.focus();}

function geometry(){let [w,h,t,b]=sizes[settings.device];if(!settings.safe)t=b=0;const H=h-t-b,T=Math.min(196,Math.max(128,H*.22)),B=Math.min(120,Math.max(88,H*.14)),M=H-T-B-16,c=Math.min((w-32)/17,(M-32)/21);return{w,h,t,b,H,T,B,M,c};}
function render(){const g=geometry();phone.classList.toggle('compact',g.H<680);phone.style.width=g.w+'px';phone.style.height=g.h+'px';screen.style.top=g.t+'px';screen.style.height=g.H+'px';modal.style.top=g.t+'px';modal.style.bottom=g.b+'px';root.querySelector('.inset.top').style.height=g.t+'px';root.querySelector('.inset.bottom').style.height=g.b+'px';root.querySelector('.inset.top').textContent=g.t?'系统安全区':'';root.querySelector('.inset.bottom').textContent=g.b?'系统手势区':'';

if(state.page==='home'){
 screen.innerHTML=homeMarkup();
}else if(state.page==='game'){
 const laneTop=g.T+8+(g.M-21*g.c)/2,laneLeft=(g.w-17*g.c)/2;

}else if(state.page==='result'){
 const l=state.level,failed=state.fixture==='error',gift=state.fixture==='gift',reward=100+20*(l-1)+80;
 screen.innerHTML=page(failed?'保存未完成':'挑战成功',`${failed?'<div class="box"><h3>通关结果尚未保存</h3><p>请重试保存。奖励到账后才能继续。</p></div>':`<div class="victory-banner">舰队凯旋</div><div class="result-reward"><div class="total">+${reward} <span style="font-size:16px">金币</span></div><div class="reward-lines"><span>首通 +${reward-80}</span><span>战斗 +80</span></div><span class="small">已入账</span></div>${boat('','result-ship')}<div class="voyage"><h3>第一海域　${l}/10</h3><div class="track"><span style="width:${l*10}%"></span></div><div class="voyage-stops"><span class="current"><b>${l}</b>已抵达</span>${l<10?`<span><b>${l+1}</b>下一关</span>`:''}<span><b>10</b>海域终点</span></div><p class="small">${l===10?'当前10关已完成，后续内容准备中。':`再过 ${10-l} 关，完成本海域。`}</p></div>`}`,failed?btn('重试保存','retry',true):`${btn(l===10?'返回主界面':gift?'回港领取首艘蓝皮':'下一关',l===10||gift?'home':'next',true)}${l<10&&!gift?btn('返回主界面','home'):''}`,'home');
}else if(state.page==='collection'){

}else if(state.page==='draw'){

}else if(state.page==='detail'){
 const i=state.selected,owned=state.owned.includes(i),equipped=state.slots.includes(i),cap=[1,2,3,5,8][i<5?0:i<9?1:i<12?2:i<14?3:4];
 screen.innerHTML=page(names[i],`<div class="hero"><div class="ship-sample">↑</div><span>${rarity(i)}品质 · ${owned?'已拥有':'未拥有'}</span></div><div class="row">${btn('转向预览','rotate')}${btn('炮击演示','fire')}</div><div class="box"><p>标准船 · 1×2</p><p>每船命中金币 ${cap===1?'1':`1～${cap}`}</p><p class="small">收益概率受同款船占比影响。移动、阻挡和每船10伤害不变。</p></div>${slots()}<p role="status">${state.notice}</p>`,owned?btn(equipped?'卸下该皮肤':'装备到舰队',equipped?'unequip':'equip',true):`${btn((state.level+(state.completed?1:0))<5?'兑换 第5关开放':'收藏券不足','exchange',false,true)}<p class="small">需要 ${[60,150,400,1000,2500][i<5?0:i<9?1:i<12?2:i<14?3:4]} 券 · 当前 0</p>`,'collection');
}else if(state.page==='shop')screen.innerHTML=page('道具补给',`<p>当前挑战剩余 ${state.remaining}/5 次使用机会</p><p class="small">补给入库 · 不增加本局次数</p>${['救援','洗牌','反转','组合包'].map((n,i)=>`<div class="box shop-product"><span class="product-mark">${icon(['life-buoy','shuffle','rotate-ccw','package'][i])}</span><div><h3>${n}</h3><p class="small">${['随机外围2船','局部最多5船','手选原地180°','三类各1'][i]}</p><p class="small">${i===3?'购买后自行使用':`现有库存 ${state.inventory[i]}`}</p></div>${btn([250,300,200,650][i]+' 金币',`buy:${i}`,true)}</div>`).join('')}<p role="status">${state.notice}</p>`,harborNav());
else if(state.page==='overview')screen.innerHTML=page('航程概览',`<div class="hero">第一海域</div><h2>${state.level} / 10 关</h2><p>${state.level===10?'当前内容已完成':'沿航线继续前进'}</p><div class="track"><span style="width:${state.level*10}%"></span></div><p class="small">仅显示已发布内容；本节点没有额外领取奖励。</p>`,`${state.level<10?btn('继续','next',true):btn('查看收藏','collection',true)}${btn('返回结算','result')}`,'result');
screen.inert=!modal.hidden;root.querySelectorAll('#tf-pages button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===state.page));globalThis.lucide?.createIcons({attrs:{width:22,height:22}});fit();}
function fit(){const g=geometry(),f=root.querySelector('.frame'),scale=Math.min(1,root.clientWidth/g.w);f.style.width=g.w*scale+'px';f.style.height=g.h*scale+'px';phone.style.transform=`scale(${scale})`;}
function singlePrice(){const u=state.owned.length-1;return u<4?300:u<8?450:u<12?700:1000;}
function draw(kind){const cost=singlePrice()*(kind==='ten'?9:1);dialog(kind==='ten'?'确认十连':'确认单抽',`<dl><dt>总价</dt><dd>${cost} 金币</dd><dt>当前余额</dt><dd>${state.coins}</dd><dt>${state.coins>=cost?'扣后余额':'还差'}</dt><dd>${Math.abs(state.coins-cost)}</dd></dl><p class="small">${kind==='ten'?'整批按当前单价×9锁价，至少一款紫或更高品质。':'结果保存成功后展示。'} 新皮肤不会自动装备。</p>`,btn(state.coins>=cost?'确认抽取':'金币不足',`draw:${kind}`,true,state.coins<cost)+btn('取消','close'));}

root.addEventListener('change',e=>{if(e.target.id==='tf-device'){settings.device=e.target.value;render();}else if(e.target.id==='tf-safe'){settings.safe=e.target.checked;render();}else if(e.target.id==='tf-fixture')reset(e.target.value);else if(e.target.dataset.filter){state[e.target.dataset.filter==='rarity'?'filter':'source']=e.target.value;render();}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){if(b.dataset.page==='result'&&!state.completed&&state.fixture!=='error'){state.coins+=100+20*(state.level-1)+80;state.completed=true;}navigate(b.dataset.page);return;}const a=b.dataset.act;if(!a)return;

if(a==='menu'||a==='pause'){dialog(a==='pause'?'已暂停':'挑战菜单','<p>第 '+state.level+' 关</p>',btn('继续挑战','close',true)+btn('重开本关','restart')+btn('设置','settings')+btn('返回主界面','home'));return;}
if(a==='settings'){dialog('设置','<p>减少动态效果、自动直出提示、静态高亮与音效将在Unity中接入原设置。</p>',btn('返回','close',true));return;}
if(a==='single'||a==='ten'){draw(a);return;}if(a==='rates'){dialog('概率与保护','<p>基础权重：白48%、蓝30%、紫15%、金6%、红1%。</p><p>十连至少紫；20抽金或以上；60抽红。保底时在满足品质的剩余权重中归一化。</p><p>连续重复保护按现有规则处理；重复转券，不增加伤害。免费蓝皮与兑换不推进保底。</p>',btn('知道了','close',true));return;}
if(a.startsWith('skin:')){state.selected=+a.split(':')[1];navigate('detail');return;}
if(a==='equip'){const slot=state.slots.indexOf(null);if(slot>=0){state.slots[slot]=state.selected;state.notice='已装备到槽位 '+(slot+1)+'，下一次挑战生效。';render();}else dialog('选择替换的槽位','<p>将 '+names[state.selected]+' 放入哪一个槽？</p>',state.slots.map((s,i)=>btn((i+1)+' · '+names[s],`replace:${i}`)).join('')+btn('取消','close'));return;}

});
root.addEventListener('keydown',e=>{if(modal.hidden){if(e.key==='Escape'&&state.page==='collection'){navigate('home');e.preventDefault();}return;}if(e.key==='Escape'){close();e.preventDefault();}if(e.key==='Tab'){const all=[...modal.querySelectorAll('button:not(:disabled)')];if(e.shiftKey&&document.activeElement===all[0]){all[all.length-1].focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===all[all.length-1]){all[0].focus();e.preventDefault();}}});
function restorePreview(snapshot){const saved=snapshot?.privateContent;if(!saved)return;if(sizes[saved.device])settings.device=saved.device;if(typeof saved.safe==='boolean')settings.safe=saved.safe;root.querySelector('#tf-device').value=settings.device;root.querySelector('#tf-safe').checked=settings.safe;const allowed=['normal','cosmetics','gift','ten','full','deadlock','error','last'];if(allowed.includes(saved.fixture)){root.querySelector('#tf-fixture').value=saved.fixture;reset(saved.fixture);}else render();}
function rememberPreview(){window.openai?.setWidgetState?.({modelContent:{preview:'V2四分类图鉴与双侧主页',fixture:state.fixture},privateContent:{device:settings.device,safe:settings.safe,fixture:root.querySelector('#tf-fixture').value}})?.catch(()=>{});}
root.addEventListener('change',rememberPreview);
window.addEventListener('openai:set_globals',e=>restorePreview(e.detail?.globals?.widgetState));
new ResizeObserver(fit).observe(root);reset();restorePreview(window.openai?.widgetState);
if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:()=>{root.querySelector('#tf-device').value=settings.device;root.querySelector('#tf-safe').checked=settings.safe;render();}});tweak.addSelect(settings,'device',{label:'画布',options:['360','390','430']});tweak.addToggle(settings,'safe',{label:'系统安全区'});}
})();
</script>
